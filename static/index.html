<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Collection Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    header h1 { font-size: 18px; font-weight: 600; }

    #reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background .2s;
    }
    #reset-btn:hover { background: rgba(255,255,255,.1); }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
    }

    .msg.agent {
      align-self: flex-start;
      background: #fff;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .state-tag {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce .6s infinite alternate;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce { to { transform: translateY(-6px); opacity: .4; } }

    #input-bar {
      background: #fff;
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #e0e0e0;
    }

    #input-bar input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    #input-bar input:focus { border-color: #1a1a2e; }

    #input-bar button {
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    #input-bar button:hover { background: #2a2a4e; }
    #input-bar button:disabled { background: #aaa; cursor: not-allowed; }

    .system-msg {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Payment Collection Agent</h1>
    <button id="reset-btn">New Session</button>
  </header>

  <div id="chat-container"></div>

  <div id="input-bar">
    <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");

    let sessionId = null;
    let sending = false;

    function addMsg(text, type, state) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      if (state) {
        const tag = document.createElement("div");
        tag.className = "state-tag";
        tag.textContent = `state: ${state}`;
        div.appendChild(tag);
      }
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function addSystem(text) {
      const div = document.createElement("div");
      div.className = "system-msg";
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "msg agent typing";
      div.id = "typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    async function sendMessage(text) {
      if (sending) return;
      if (!text.trim()) return;

      sending = true;
      sendBtn.disabled = true;
      msgInput.value = "";

      addMsg(text, "user");
      showTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        sessionId = data.session_id;
        hideTyping();
        addMsg(data.response, "agent", data.state);
      } catch (err) {
        hideTyping();
        addSystem("Error connecting to agent. Please try again.");
        console.error(err);
      } finally {
        sending = false;
        sendBtn.disabled = false;
        msgInput.focus();
      }
    }

    sendBtn.addEventListener("click", () => sendMessage(msgInput.value));

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage(msgInput.value);
    });

    resetBtn.addEventListener("click", async () => {
      if (sessionId) {
        fetch(`/api/session/${sessionId}/reset`).catch(() => {});
      }
      sessionId = null;
      chatContainer.innerHTML = "";
      addSystem("New session started. Type a message to begin.");
    });

    msgInput.focus();
  </script>
</body>
</html>
